name: cuda-t4-release-turboquant

on:
  schedule:
    - cron: "17 4 * * 1,4"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/SHA/refs/pull/N/head (blank = HEAD of default branch)"
        required: false
        type: string
      force:
        description: "Rebuild even if the release already exists"
        type: boolean
        default: false

permissions: { contents: read }

concurrency:
  group: cuda-t4-release-turboquant-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: turboquant
          REF: ${{ inputs.ref }}
          FORCE: ${{ inputs.force }}
        run: bash .github/scripts/plan.sh

  build:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    container: ${{ matrix.container || null }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CUDA_HOME: /usr/local/cuda-${{ matrix.cuda }}
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Install dependencies
        run: |
          S=$(command -v sudo || true)
          $S apt-get update
          $S apt-get install -y --no-install-recommends \
            git curl ca-certificates gnupg \
            build-essential cmake ninja-build ccache libssl-dev jq libgomp1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          path: src
          fetch-depth: 1
      - name: Install CUDA
        run: bash .github/scripts/install-cuda.sh "${{ matrix.ubuntu }}" "${{ matrix.cuda }}"
      - uses: ggml-org/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ matrix.name }}-u${{ matrix.ubuntu }}-cuda${{ matrix.cuda_mm }}
          evict-old-files: 7d
          max-size: 1G
      - name: Configure and build
        run: |
          export PATH="$CUDA_HOME/bin:$PATH"
          cmake -S src -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=ON -DCMAKE_CUDA_COMPILER="$CUDA_HOME/bin/nvcc" \
            -DCMAKE_CUDA_ARCHITECTURES=75-real -DGGML_NATIVE=OFF \
            -DGGML_CUDA_FA_ALL_QUANTS=OFF -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++" \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF
          cmake --build build -j"$(nproc)" \
            --target llama-server llama-cli llama-bench llama-quantize llama-perplexity
      - name: Package
        env:
          NAME: ${{ matrix.name }}
          REPO: ${{ matrix.repo }}
          SHA: ${{ matrix.sha }}
          REF: ${{ matrix.ref }}
          TAG: ${{ matrix.tag }}
          PRERELEASE: ${{ matrix.prerelease }}
          UBUNTU: ${{ matrix.ubuntu }}
          CUDA: ${{ matrix.cuda }}
          CUDA_MM: ${{ matrix.cuda_mm }}
          ASSET: ${{ matrix.asset }}
        run: bash .github/scripts/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Stage release assets
        id: stage
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: bash .github/scripts/stage-release.sh
      - name: Publish immutable release
        if: steps.stage.outputs.publish == 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.stage.outputs.tag }}
          files: ${{ steps.stage.outputs.assets_dir }}/*
          prerelease: ${{ steps.stage.outputs.prerelease }}
          body_path: ${{ steps.stage.outputs.notes }}
          fail_on_unmatched_files: true
      - name: Publish rolling latest release
        if: steps.stage.outputs.publish == 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.stage.outputs.latest_tag }}
          files: ${{ steps.stage.outputs.latest_dir }}/*
          prerelease: true
          body_path: ${{ steps.stage.outputs.latest_notes }}
          fail_on_unmatched_files: true
      - name: Prune old immutable releases
        if: steps.stage.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.stage.outputs.name }}
        run: bash .github/scripts/prune-releases.sh
